name: Release & Multiplatform Distribution

on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g. v0.1.0)
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Version tag to build (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: read
  # contents:write and id-token:write are granted per-job below, scoped to the
  # two jobs that actually create a release or mint an OIDC token.
  # packages:write and attestations:write were granted workflow-wide with
  # nothing in this file that publishes a package or calls attest-build-
  # provenance — dropped.

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------
  # 1. Pre-Release Security & Integrity Gate
  # -------------------------------------------------------------
  pre-release-gate:
    name: Pre-Release Verification Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install Linux System Dependencies
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev build-essential libayatana-appindicator3-dev

      - uses: pnpm/action-setup@a3252b78c470c02df07e9d792d8704cc65c768ca # v3.0.0
        with:
          version: 9
      - name: Setup Node & Rust Toolchains
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'pnpm'

      # Floating on purpose — see the note in ci.yml's rust-security job.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-deny
        timeout-minutes: 4
        run: cargo install cargo-deny
      - name: Run cargo-deny
        timeout-minutes: 3
        run: cargo deny --manifest-path src-tauri/Cargo.toml --config deny.toml check

      - name: Run Dependency Audit & License Checks
        timeout-minutes: 5
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level=high
          pnpm dlx license-checker --onlyAllow "MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;0BSD;Unlicense" --production --excludePrivatePackages --summary
          pnpm run build

      - name: Run Rust Security Linters & Tests
        timeout-minutes: 5
        run: |
          cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml

  # -------------------------------------------------------------
  # 2. Multiplatform Binary Build Matrix (macOS, Windows, Linux)
  # -------------------------------------------------------------
  build-and-package:
    name: Build (${{ matrix.platform.name }})
    needs: [pre-release-gate]
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 30
    permissions:
      contents: write # tauri-action creates/updates a draft GitHub Release
    strategy:
      fail-fast: false
      matrix:
        platform:
          # macOS Universal / Apple Silicon (DMG & App bundle)
          - name: macOS-ARM64
            os: macos-14
            target: aarch64-apple-darwin
            rust_target: aarch64-apple-darwin

          # macOS Intel (DMG & App bundle)
          - name: macOS-x86_64
            os: macos-13
            target: x86_64-apple-darwin
            rust_target: x86_64-apple-darwin

          # Windows x64 (MSI & NSIS .exe setup)
          - name: Windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_target: x86_64-pc-windows-msvc

          # Linux x64 (.deb, .AppImage, .rpm)
          - name: Linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust_target: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install System Dependencies (Linux)
        if: matrix.platform.os == 'ubuntu-22.04'
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev build-essential curl wget file libayatana-appindicator3-dev

      - uses: pnpm/action-setup@a3252b78c470c02df07e9d792d8704cc65c768ca # v3.0.0
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'pnpm'

      # Floating on purpose — see the note in ci.yml's rust-security job.
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.rust_target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Frontend Dependencies
        timeout-minutes: 4
        run: pnpm install --frozen-lockfile

      # Build Multiplatform Tauri Bundles
      - name: Build Tauri Desktop Application
        timeout-minutes: 20
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name || inputs.tag_name }}
          releaseName: 'k8sUI ${{ github.ref_name || inputs.tag_name }}'
          releaseBody: 'See changelog for details.'
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.platform.target }}

      - name: Upload Artifacts for Signing
        timeout-minutes: 5
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: artifacts-${{ matrix.platform.name }}
          path: |
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

  # -------------------------------------------------------------
  # 3. SBOM Generation, Cosign Signing & Final Release Publish
  # -------------------------------------------------------------
  publish-release:
    name: Generate SBOM, Sign Artifacts & Publish Release
    needs: [build-and-package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Creates/updates the GitHub Release and uploads its assets
      id-token: write # For Sigstore / Cosign keyless signing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@a3252b78c470c02df07e9d792d8704cc65c768ca # v3.0.0
        with:
          version: 9
      - name: Setup Node & Rust for SBOM
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # Floating on purpose — see the note in ci.yml's rust-security job.
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Sigstore Cosign
        timeout-minutes: 3
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Download all platform artifacts
        timeout-minutes: 5
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-artifacts

      - name: Generate CycloneDX SBOMs (Rust + Node)
        timeout-minutes: 5
        run: |
          mkdir -p sbom
          # Generate Rust SBOM
          cargo install cargo-cyclonedx
          cargo cyclonedx --manifest-path src-tauri/Cargo.toml --output-format json -f sbom/rust-bom.cdx.json
          
          # Generate Frontend Node SBOM
          pnpm install --frozen-lockfile
          pnpm dlx @cyclonedx/cyclonedx-npm --output-file sbom/frontend-bom.cdx.json

      - name: Generate SHA256 Checksums
        timeout-minutes: 2
        run: |
          cd release-artifacts
          find . -type f \( -name "*.dmg" -o -name "*.msi" -o -name "*.exe" -o -name "*.deb" -o -name "*.AppImage" \) -exec sha256sum {} + > ../SHA256SUMS
          cat ../SHA256SUMS

      - name: Sign Checksums & SBOMs via Sigstore Cosign (OIDC)
        timeout-minutes: 3
        run: |
          echo "Signing SHA256SUMS and SBOM with Sigstore OIDC..."
          cosign sign-blob --yes --bundle SHA256SUMS.bundle.json SHA256SUMS
          cosign sign-blob --yes --bundle sbom/rust-bom.bundle.json sbom/rust-bom.cdx.json
          cosign sign-blob --yes --bundle sbom/frontend-bom.bundle.json sbom/frontend-bom.cdx.json

      - name: Create or Update GitHub Release
        timeout-minutes: 5
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name || inputs.tag_name }}
          name: 'k8sUI ${{ github.ref_name || inputs.tag_name }}'
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/**/bundle/**/*
            sbom/*.json
            SHA256SUMS
            SHA256SUMS.bundle.json
            sbom/*.bundle.json
