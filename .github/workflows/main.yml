name: Unified CI, Release & Distribution Pipeline

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1' # Weekly security baseline scan
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: false
        type: choice
        options:
          - none
          - patch
          - minor
          - major
        default: 'none'
      custom_version:
        description: 'Custom version override (e.g. 0.2.0, leave empty to auto-bump)'
        required: false
        type: string
      tag_name:
        description: 'Manual release build tag target (e.g. v0.1.0)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  # =========================================================================
  # 0. Manual Tag & Version Bump (triggered on workflow_dispatch with bump)
  # =========================================================================
  tag-new-version:
    name: Bump Versions & Tag Release
    if: github.event_name == 'workflow_dispatch' && (inputs.version_type != 'none' || inputs.custom_version != '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node & Git User
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Configure Git for DCO Sign-off
        timeout-minutes: 1
        run: |
          git config --global user.name "k8sUI Release Bot"
          git config --global user.email "bot@akretrix.org"

      - name: Determine New Version
        id: versioning
        timeout-minutes: 1
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current version: $CURRENT_VERSION"

          if [ -n "${{ inputs.custom_version }}" ]; then
            NEW_VERSION="${{ inputs.custom_version }}"
          else
            pnpm version ${{ inputs.version_type }} --no-git-tag-version
            NEW_VERSION=$(node -p "require('./package.json').version")
          fi

          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "TAG_NAME=v$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Bumping to version $NEW_VERSION (tag: v$NEW_VERSION)"

      - name: Update Rust & Tauri Manifest Versions
        timeout-minutes: 2
        run: |
          NEW_VER="${{ steps.versioning.outputs.NEW_VERSION }}"

          # Update src-tauri/Cargo.toml
          sed -i.bak "s/^version = \".*\"/version = \"$NEW_VER\"/" src-tauri/Cargo.toml
          rm -f src-tauri/Cargo.toml.bak

          # Update src-tauri/tauri.conf.json
          node -e "
            const fs = require('fs');
            const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json'));
            conf.version = '$NEW_VER';
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2) + '\n');
          "

      - name: Commit Version Bumps with DCO Sign-off
        timeout-minutes: 2
        run: |
          NEW_TAG="${{ steps.versioning.outputs.TAG_NAME }}"
          git add -u
          git commit -s -m "chore(release): bump version to $NEW_TAG"
          git push origin main

      - name: Create and Push Release Tag
        timeout-minutes: 2
        run: |
          NEW_TAG="${{ steps.versioning.outputs.TAG_NAME }}"
          git tag -s -a "$NEW_TAG" -m "Release $NEW_TAG" || git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
          git push origin "$NEW_TAG"
          echo "Successfully pushed tag $NEW_TAG. Tag release pipeline triggered."

  # =========================================================================
  # 1. CI / PR Verification & Security Gates
  # =========================================================================
  dco-check:
    name: DCO Verification (git commit -s)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Verify Signed-off-by Trailer
        timeout-minutes: 2
        run: |
          COMMITS=$(git log --no-merges origin/${{ github.base_ref }}..HEAD --format="%H")
          for COMMIT in $COMMITS; do
            if ! git log -n 1 --format="%B" $COMMIT | grep -q "Signed-off-by:"; then
              echo "::error::Commit $COMMIT is missing 'Signed-off-by:' trailer (DCO requirement)."
              exit 1
            fi
          done
          echo "All PR commits comply with DCO 1.1."

  secret-scan:
    name: Secret & Credential Leak Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        timeout-minutes: 3
        run: |
          wget https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.2_linux_x64.tar.gz
          ./gitleaks detect --source . -v --config .gitleaks.toml

  rust-security:
    name: Rust SAST, Linters & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Linux System Dependencies
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libssl-dev build-essential libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-deny
        timeout-minutes: 4
        run: cargo install cargo-deny
      - name: Run cargo-deny
        timeout-minutes: 4
        run: cargo deny --manifest-path src-tauri/Cargo.toml --config deny.toml check
      - name: Cargo fmt check
        timeout-minutes: 2
        run: cargo fmt --all --check --manifest-path src-tauri/Cargo.toml
      - name: Cargo clippy SAST (Zero Warnings)
        timeout-minutes: 10
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Cargo test
        timeout-minutes: 15
        run: cargo test --manifest-path src-tauri/Cargo.toml

  frontend-security:
    name: Frontend Lint & License Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install dependencies
        timeout-minutes: 4
        run: pnpm install --frozen-lockfile
      - name: License check (Apache-2.0, MIT, BSD, ISC only)
        timeout-minutes: 2
        run: pnpm dlx license-checker --onlyAllow "MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;0BSD;Unlicense" --production --excludePrivatePackages --summary
      - name: Run Unit & Functional Tests
        timeout-minutes: 4
        run: pnpm test
      - name: Verify Production Build
        timeout-minutes: 5
        run: pnpm run build

  trivy-scan:
    name: Trivy Vulnerability Scan (SARIF)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run Trivy Scanner
        timeout-minutes: 7
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
      - name: Upload SARIF to GitHub Security Tab
        timeout-minutes: 3
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

  # =========================================================================
  # 2. Multiplatform Binary Build Matrix (Only on tag push or dispatch build)
  # =========================================================================
  build-and-package:
    name: Build (${{ matrix.platform.name }})
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
    needs: [rust-security, frontend-security, secret-scan]
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS-ARM64
            os: macos-14
            target: aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
          - name: macOS-x86_64
            os: macos-14
            target: x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
          - name: Windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_target: x86_64-pc-windows-msvc
          - name: Linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust_target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install System Dependencies (Linux)
        if: matrix.platform.os == 'ubuntu-22.04'
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libssl-dev build-essential curl wget file libayatana-appindicator3-dev

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.rust_target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Frontend Dependencies
        timeout-minutes: 4
        run: pnpm install --frozen-lockfile

      - name: Build Tauri Desktop Application
        timeout-minutes: 30
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name || inputs.tag_name }}
          releaseName: 'k8sUI ${{ github.ref_name || inputs.tag_name }}'
          releaseBody: 'See changelog for details.'
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.platform.target }}

      - name: Verify Package Integrity Before Upload
        timeout-minutes: 5
        shell: bash
        run: |
          echo "=== Verifying Generated Bundles for ${{ matrix.platform.name }} ==="
          if [[ "${{ matrix.platform.os }}" == *"macos"* ]]; then
            for dmg in src-tauri/target/${{ matrix.platform.target }}/release/bundle/dmg/*.dmg; do
              [ -f "$dmg" ] || continue
              echo "Verifying DMG structure: $dmg"
              hdiutil verify "$dmg"
            done
          elif [[ "${{ matrix.platform.os }}" == *"ubuntu"* ]]; then
            for deb in src-tauri/target/${{ matrix.platform.target }}/release/bundle/deb/*.deb; do
              [ -f "$deb" ] || continue
              echo "Verifying DEB package: $deb"
              dpkg-deb -I "$deb"
            done
            for appimage in src-tauri/target/${{ matrix.platform.target }}/release/bundle/appimage/*.AppImage; do
              [ -f "$appimage" ] || continue
              echo "Verifying AppImage binary: $appimage"
              test -s "$appimage"
            done
          fi

      - name: Upload Artifacts for Signing
        timeout-minutes: 5
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: artifacts-${{ matrix.platform.name }}
          path: |
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

  # =========================================================================
  # 3. SBOM Generation, Cosign Signing & Final Release Publish
  # =========================================================================
  publish-release:
    name: Generate SBOM, Sign Artifacts & Publish Release
    needs: [build-and-package]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node & Rust for SBOM
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Sigstore Cosign
        timeout-minutes: 3
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Download all platform artifacts
        timeout-minutes: 8
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-artifacts

      - name: Generate CycloneDX SBOMs (Rust + Node)
        timeout-minutes: 8
        run: |
          mkdir -p sbom
          cargo install cargo-cyclonedx
          cargo cyclonedx --manifest-path src-tauri/Cargo.toml --format json
          find src-tauri -maxdepth 1 -name "*.cdx.json" -exec cp {} sbom/rust-bom.cdx.json \; || cp src-tauri/bom.json sbom/rust-bom.cdx.json
          test -s sbom/rust-bom.cdx.json

          pnpm install --frozen-lockfile
          pnpm dlx @cyclonedx/cyclonedx-npm --ignore-npm-errors --output-file sbom/frontend-bom.cdx.json
          test -s sbom/frontend-bom.cdx.json

      - name: Generate SHA256 Checksums
        timeout-minutes: 4
        run: |
          cd release-artifacts
          find . -type f \( -name "*.dmg" -o -name "*.msi" -o -name "*.exe" -o -name "*.deb" -o -name "*.AppImage" \) -exec sha256sum {} + > ../SHA256SUMS
          cat ../SHA256SUMS

      - name: Sign Checksums & SBOMs via Sigstore Cosign (OIDC)
        timeout-minutes: 5
        run: |
          echo "Signing SHA256SUMS and SBOM with Sigstore OIDC..."
          cosign sign-blob --yes --bundle SHA256SUMS.bundle.json SHA256SUMS
          cosign sign-blob --yes --bundle sbom/rust-bom.bundle.json sbom/rust-bom.cdx.json
          cosign sign-blob --yes --bundle sbom/frontend-bom.bundle.json sbom/frontend-bom.cdx.json

      - name: Create or Update GitHub Release
        timeout-minutes: 8
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name || inputs.tag_name }}
          name: 'k8sUI ${{ github.ref_name || inputs.tag_name }}'
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/**/bundle/**/*
            sbom/*.json
            SHA256SUMS
            SHA256SUMS.bundle.json
            sbom/*.bundle.json
