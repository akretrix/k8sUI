<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162033"/>
      <stop offset="55%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#06090E"/>
    </linearGradient>

    <!-- Specular Squircle Rim Border -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="45%" stop-color="#326CE5" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>

    <!-- Outer Hexagon Frame Gradient -->
    <linearGradient id="hexStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#326CE5" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1D44A5" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Isometric Cube Face Gradients -->
    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="45%" stop-color="#326CE5"/>
      <stop offset="100%" stop-color="#2557C7"/>
    </linearGradient>

    <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2557C7"/>
      <stop offset="100%" stop-color="#143175"/>
    </linearGradient>

    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1D44A5"/>
      <stop offset="100%" stop-color="#0B1736"/>
    </linearGradient>

    <!-- Specular Y-Axis Rim Light -->
    <linearGradient id="rimLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.2"/>
    </linearGradient>

    <radialGradient id="ambient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#326CE5" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#326CE5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="510" height="510" x="1" y="1" rx="111" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Subtle Ambient Aura -->
  <circle cx="256" cy="256" r="190" fill="url(#ambient)"/>

  <!-- Outer Control-Plane Hexagon Frame -->
  <polygon
    points="256,88 402,172 402,340 256,424 110,340 110,172"
    fill="#326CE5"
    fill-opacity="0.06"
    stroke="url(#hexStroke)"
    stroke-width="9"
    stroke-linejoin="round"
  />

  <!-- 3-Axis Structural Spokes -->
  <g stroke="#326CE5" stroke-width="7" stroke-opacity="0.5" stroke-linecap="round">
    <line x1="256" y1="92" x2="256" y2="152"/>
    <line x1="114" y1="338" x2="166" y2="308"/>
    <line x1="398" y1="338" x2="346" y2="308"/>
  </g>

  <!-- Main Isometric Cluster Cube -->
  <g>
    <polygon points="256,152 346,204 256,256 166,204" fill="url(#cubeTop)"/>
    <polygon points="166,204 256,256 256,360 166,308" fill="url(#cubeLeft)"/>
    <polygon points="256,256 346,204 346,308 256,360" fill="url(#cubeRight)"/>
    <polygon points="256,152 346,204 346,308 256,360 166,308 166,204" stroke="#60A5FA" stroke-opacity="0.55" stroke-width="3.5" stroke-linejoin="round" fill="none"/>
    <path d="M166,204 L256,256 L346,204 M256,256 L256,360" stroke="url(#rimLight)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Top-Right Active Status Node (Emerald) -->
  <circle cx="402" cy="172" r="30" fill="#0B0F17"/>
  <circle cx="402" cy="172" r="21" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="5.5"/>
  <circle cx="402" cy="172" r="9.5" fill="#34D399"/>
</svg>
