  <polygon 
    points="16,2 29,9.5 29,22.5 16,30 3,22.5 3,9.5" 
    stroke="#326CE5" 
    stroke-width="2.5" 
    stroke-linejoin="round"
    fill="#0B0F17"
  />
  
  <!-- Central Cluster Hub -->
  <circle cx="16" cy="16" r="3.5" fill="#4D88FF" />

  <!-- Spokes connecting to vertices -->
